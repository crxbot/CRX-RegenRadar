name: Fetch HymecNG File and Generate Webp

on:
  workflow_dispatch:

concurrency:
  # verhindert, dass zwei Laeufe gleichzeitig dieselbe Datei generieren/hochladen
  group: fetch-hymecng
  cancel-in-progress: false

env:
  # so viele WEBPs sollen im R2-Bucket max. gleichzeitig liegen
  MAX_KEEP: 12
  R2_PREFIX: liveanalyse
  WEBP_TARGET_MINUTE: 4
  WEBP_TARGET_SECOND: 10

jobs:
  fetch_generate_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Sicherheitsnetz, falls die Datei nie erscheint

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.LIVE_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set RUN and DATE (rounded to 5 min, UTC)
        id: set_run_date
        run: |
          HOUR=$(date -u +%H)
          MINUTE_RAW=$(date -u +%M)
          MINUTE=$(( (10#$MINUTE_RAW / 5) * 5 ))
          TIME=$(printf "%02d%02d" "$HOUR" "$MINUTE")
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          DATE=$(date -u +%Y%m%d)

          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "SLOT_EPOCH=$(date -u -d "${YEAR}-${MONTH}-${DAY} ${HOUR}:${MINUTE}:00" +%s)" >> $GITHUB_ENV
          echo "BERLIN_TIME=$(TZ=Europe/Berlin date -d "@$SLOT_EPOCH" +%H%M)" >> $GITHUB_ENV
          echo "BERLIN_DATE=$(TZ=Europe/Berlin date -d "@$SLOT_EPOCH" +%Y%m%d)" >> $GITHUB_ENV
          echo "run=${DATE}_${TIME}" >> $GITHUB_OUTPUT

      - name: Download HymecNG composite file from DWD Open Data (mit Retry)
        run: |
          mkdir -p data/hymecng

          FILENAME="composite_HymecNG_${DATE}_${TIME}_000-hd5"
          URL="https://opendata.dwd.de/weather/radar/composite/hymecng/${FILENAME}"
          OUT="data/hymecng/${FILENAME}"

          # Die Datei erscheint normalerweise ~1 Min nach dem 5-Minuten-Slot,
          # in Ausnahmefaellen bis zu ~2 Min spaeter. Wir pollen alle 15s,
          # bis zu 50 Versuche = max. 4 Minuten Wartezeit.
          MAX_ATTEMPTS=50
          SLEEP_SECONDS=5

          echo "Warte auf: $URL"
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            HTTP_CODE=$(curl -s -o "$OUT" -w "%{http_code}" \
              --connect-timeout 10 --max-time 60 \
              "$URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ] && [ -s "$OUT" ]; then
              echo "Datei erfolgreich geladen (Versuch $i/$MAX_ATTEMPTS, HTTP $HTTP_CODE)."
              exit 0
            fi

            echo "Versuch $i/$MAX_ATTEMPTS: Datei noch nicht verfuegbar (HTTP $HTTP_CODE). Warte ${SLEEP_SECONDS}s..."
            rm -f "$OUT"
            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Datei nach $MAX_ATTEMPTS Versuchen (~$(( MAX_ATTEMPTS * SLEEP_SECONDS / 60 )) Minuten) nicht verfuegbar - Abbruch."
          exit 1

      - name: Warten bis feste Uhrzeit erreicht ist
        run: |
          TARGET=$(( SLOT_EPOCH + WEBP_TARGET_MINUTE * 60 + WEBP_TARGET_SECOND ))
          NOW=$(date -u +%s)
          WAIT=$(( TARGET - NOW ))

          echo "Slot: ${DATE}_${TIME} | Zielzeit: $(date -u -d "@$TARGET" +%H:%M:%S) UTC | Jetzt: $(date -u -d "@$NOW" +%H:%M:%S) UTC"

          if [ "$WAIT" -gt 0 ]; then
            echo "Warte ${WAIT}s ..."
            sleep "$WAIT"
          else
            echo "Zielzeit schon ueberschritten - weiter ohne Wartezeit."
          fi

      - name: Generate WEBP for HymecNG
        run: python scripts/generate_webp.py

      - name: Download bestehende metadata.json aus R2 (falls vorhanden)
        run: |
          aws s3 cp \
            "s3://${{ secrets.R2_BUCKET }}/${R2_PREFIX}/metadata.json" \
            ./metadata_prev.json \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            || echo "Keine bestehende metadata.json in R2 gefunden - starte frisch."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Build metadata.json (mit bestehendem Stand mergen, auf ${{ env.MAX_KEEP }} Timesteps kuerzen)
        run: |
          python scripts/generate_metadata.py output \
            --run "${{ steps.set_run_date.outputs.run }}" \
            --date "$DATE" \
            --existing ./metadata_prev.json \
            --max-keep "$MAX_KEEP" \
            --meta-out ./metadata.json \
            --removed-out ./removed_files.txt

      - name: Upload neue WEBP zu R2
        run: |
          aws s3 cp \
            "output/hymecng/liveanalyse_${BERLIN_DATE}_${BERLIN_TIME}.webp" \
            "s3://${{ secrets.R2_BUCKET }}/${R2_PREFIX}/liveanalyse_${BERLIN_DATE}_${BERLIN_TIME}.webp" \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload aktualisierte metadata.json zu R2
        run: |
          aws s3 cp \
            ./metadata.json \
            "s3://${{ secrets.R2_BUCKET }}/${R2_PREFIX}/metadata.json" \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Aus dem Fenster gefallene alte WEBPs aus R2 loeschen
        run: |
          if [ -s ./removed_files.txt ]; then
            while IFS= read -r fname || [ -n "$fname" ]; do
              [ -z "$fname" ] && continue
              echo "Loesche $fname aus R2 ..."
              aws s3 rm \
                "s3://${{ secrets.R2_BUCKET }}/${R2_PREFIX}/$fname" \
                --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
            done < ./removed_files.txt
          else
            echo "Nichts zu loeschen - Fenster noch nicht voll oder unveraendert."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
